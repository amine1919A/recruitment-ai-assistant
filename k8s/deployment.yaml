apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-app
  template:
    metadata:
      labels:
        app: laravel-app
    spec:
      containers:
        - name: laravel
          image: amineabdelli1/recruitment-ai:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: APP_KEY
              value: "base64:2fl+Jb4JHbHvaTFgE3BNpjLDfkKIHpBHjqFmJPXhMew="
            - name: APP_URL
              value: http://localhost:30080
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: mysql-service
            - name: DB_DATABASE
              value: recAi
            - name: DB_USERNAME
              value: laravel
            - name: DB_PASSWORD
              value: laravel123